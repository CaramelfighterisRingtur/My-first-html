<!DOCTYPE html>
<html lang="en">
<head>
    <link href="Position.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airplane Positioning</title>
</head>
<body>
<h2>AIRPLANE POSITIONING</h2>
<div>
    Airplane with no positioning property
</div>
<div class="sticky">
    Airplane with sticky position property
</div>
<div class="relative">
    This Airplane element has position: relative;
    <div class="absolute">
        Absolute class DIV
    </div>
</div>
<div class="fixed">
    Airplane with fixed position property
</div>
    
</body>
</html>
