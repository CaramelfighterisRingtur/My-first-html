<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Javascript String Methods</h2>
    <p>Basic Methods</p>
    <script>
        var str = 'Amazing!';
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith ('i'));
        document.write("<br>")

        // Test Method -> Returns true or false
        var str1 = "I learned about methods, And my name is Elian"
        var patt = new RegExp("Elian");
        var res = patt.test(str1);
        document.write(res);
    </script>
</body>
</html>
