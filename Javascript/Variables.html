<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Javascript Variables</h1>
    <p>Sum of two numbers</p>
    <p id="result"></p>
    <p id="Theotherresult"></p>
    <p id="Anotherresult"></p>
    <p id="Theremainder"></p>
    <script>
        var num1 = 5;
        var num2 = 6;
        var sum = num1 + num2;
        var product = num1 * num2;
        var divide = num1 / num2;
        var remainder = num1 % num2;
        document.getElementById("result").innerHTML = 
        "The total sum is: " + sum;
        document.getElementById("Theotherresult").innerHTML = 
        "The product is: " + product;
        document.getElementById("Anotherresult").innerHTML = 
        "The quotient is: " + divide;
        document.getElementById("Theremainder").innerHTML = 
        "The remainder is:(num1/num2) " + remainder
    </script>
</body>
</html>
