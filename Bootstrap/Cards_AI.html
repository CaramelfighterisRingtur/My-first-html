<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Card</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #ff7e5f, #6a11cb);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 22rem;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin-top: -50px;
        }

        .btn-custom {
            border-radius: 50px;
            background: linear-gradient(45deg, #ff512f, #dd2476);
            border: none;
        }

        .btn-custom:hover {
            opacity: 0.9;
        }

        .badge-custom {
            background-color: rgba(255,255,255,0.2);
            margin: 3px;
        }
    </style>
</head>

<body>

    <div class="card text-center">

        <img class="card-img-top"
             src="https://de7i3bh7bgh0d.cloudfront.net/2024/04/19/17/37/11/66058c70-56cd-4eb3-bdaf-fb48ed65ec27/JJKOfficialCharacterGuide_blogsplash_1200x630.jpg"
             alt="Banner">

        <div class="card-body">

            <!-- Profile Image -->
            <img src="https://i.pravatar.cc/150?img=3" class="profile-img">

            <h4 class="mt-3 font-weight-bold">Toluwanimi Olatoye</h4>

            <p class="text-light">
                🚀 Passionate Developer <br>
                💡 Loves building cool stuff
            </p>

            <!-- Skills -->
            <div>
                <span class="badge badge-custom">HTML</span>
                <span class="badge badge-custom">CSS</span>
                <span class="badge badge-custom">JavaScript</span>
            </div>

            <a href="#" class="btn btn-custom btn-block mt-3">
                View Profile
            </a>

        </div>

    </div>

</body>
</html>
