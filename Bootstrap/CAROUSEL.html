<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Responsive meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Carousel Fixed</title>

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- REQUIRED: jQuery + Popper + Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>

<body>

<div class="container mt-4">
    <h2>Example of Carousel</h2>

    <!-- Carousel -->
    <div id="myCarousel" class="carousel slide" data-ride="carousel">

        <!-- Indicators -->
        <ol class="carousel-indicators">
            <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
            <li data-target="#myCarousel" data-slide-to="1"></li>
            <li data-target="#myCarousel" data-slide-to="2"></li>
        </ol>

        <!-- Slides Wrapper -->
        <div class="carousel-inner">

            <!-- Slide 1 -->
            <div class="carousel-item active">
                <img class="d-block w-100"
                     src="https://upload.wikimedia.org/wikipedia/commons/f/f0/Artist%27s_impression_of_LOSAT_launch_from_CCVL_chassis.jpg"
                     alt="Image 1">
            </div>

            <!-- Slide 2 -->
            <div class="carousel-item">
                <img class="d-block w-100"
                     src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/..."
                     alt="Image 2">
            </div>

            <!-- Slide 3 -->
            <div class="carousel-item">
                <img class="d-block w-100"
                     src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/..."
                     alt="Image 3">
            </div>

        </div>

        <!-- Controls -->

        <!-- Previous -->
        <a class="carousel-control-prev" href="#myCarousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="sr-only">Previous</span>
        </a>

        <!-- Next -->
        <a class="carousel-control-next" href="#myCarousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="sr-only">Next</span>
        </a>

    </div>
</div>

</body>
</html>
